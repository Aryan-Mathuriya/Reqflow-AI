
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: reqflow-backend
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    volumes:
      - reqflow_data:/app/app/database
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: reqflow-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  reqflow_data:
